name: eCredit.com
description: >-
  eCredit.com was an online trade-credit and credit-decisioning company, surfaced in the API
  Evangelist network as a Battery Ventures portfolio company. It no longer operates independently. The
  ecredit.com domain is delegated to Moody's nameservers and 301-redirects in full to Moody's trade-credit
  offering, where "Moody's eCredit" now exists as a platform within Moody's Trade Credit product line.
  Enrichment probes confirm no independent developer portal, documentation, API specification, or
  /.well-known surface remains on ecredit.com. Any live API capability for this product is delivered
  through Moody's, which is profiled separately in the network as the successor company.
